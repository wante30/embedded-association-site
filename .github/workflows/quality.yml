name: Build and visual verification
on:
  push:
    branches: [master, 'redesign/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Content and regression contracts
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test production website and capture every page
        run: python tests/visual_review.py
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-visual-review
          path: artifacts/review/
          retention-days: 14
      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
          retention-days: 14
      - name: Package reviewed source
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/website-source.zip
      - name: Upload reviewed source
        uses: actions/upload-artifact@v4
        with:
          name: website-source
          path: artifacts/website-source.zip
          retention-days: 14
