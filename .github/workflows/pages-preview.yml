name: Deploy redesigned site to GitHub Pages

on:
  push:
    branches: ["redesign/reference-ui-v1"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages-preview"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build for GitHub Pages project path
        run: npm run build -- --base /embedded-association-site/
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Verify project-path build
        run: |
          grep -q '/embedded-association-site/assets/' dist/index.html
          grep -R -q '/embedded-association-site/images/' dist/assets
          test -f dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
